services:
  # Producción: docker compose up --build web
  web:
    build:
      context: .
      target: runner
    image: valdeortiz-portfolio:latest
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://valdeortiz.com}
    restart: unless-stopped

  # Desarrollo con hot reload: docker compose up dev
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Volúmenes anónimos: no pisar lo instalado/compilado dentro del contenedor.
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    profiles: ["dev"]
